[project]
name = "model-quantization-aggregation"
version = "2.0"
description = ""
authors = ["Santiago del Rey <santiago.del.rey@upc.edu>"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "altair[all]>=6.0.0",
    "forestplot>=0.4.1",
    "google-genai>=1.56.0",
    "itables>=2.6.1",
    "jsonlines>=4.0.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandarallel>=1.6.5",
    "pandas>=2.3.3",
    "polars[excel]>=1.36.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.1",
    "xmltodict>=1.0.2",
    "click>=8.1.8",
]

[project.scripts]
mq = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    #Pylint
    "PL",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "openpyxl>=3.1.5",
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
]
test = [
    "pytest>=9.1.1",
]
